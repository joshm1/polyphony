[project]
name = "polyphony"
version = "0.1.0"
description = "Diarization you can audit: speaker-attributed transcripts with per-chunk confidence, a review UI to correct them, and exports of the corrected data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Josh McDade", email = "josh.ncsu@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["speech-to-text", "diarization", "speaker-diarization", "transcription", "whisper", "pyannote", "asr", "subtitles", "journalism", "podcast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "assemblyai>=0.40",
    "click>=8.1",
    "fastapi>=0.135.3",
    "google-genai>=0.8",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-ai-slim[anthropic,google,openai]>=2.48",
    "uvicorn[standard]>=0.44.0",
]

[project.optional-dependencies]
# The offline `local` backend: Whisper + pyannote. Several GB of model runtime,
# so it's opt-in: `uv tool install "polyphony[local] @ git+https://github.com/joshm1/polyphony"`.
local = [
    "pyannote-audio>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
]

[project.urls]
Homepage = "https://github.com/joshm1/polyphony"
Repository = "https://github.com/joshm1/polyphony"
Issues = "https://github.com/joshm1/polyphony/issues"

[project.scripts]
polyphony = "polyphony.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship the built React playground alongside the .py modules. The frontend
# lives in `frontend/` and builds into `src/polyphony/static/` — that
# output is committed so installs don't require Node at install time.
module-name = "polyphony"
module-root = "src"
source-include = ["src/polyphony/static/**"]
wheel-include = ["src/polyphony/static/**"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # click uses function calls in defaults
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
